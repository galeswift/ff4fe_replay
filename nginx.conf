server {
    listen 80;
    root /usr/share/nginx/html;

    # Redirects keep the visitor's host and https instead of nginx's own http://host:80
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The site is public at /replay/. Accept paths with or without that prefix, so it works
    # whether or not the proxy strips it.
    rewrite ^/replay$ / last;
    rewrite ^/replay/(.*)$ /$1 last;

    # Build output has content hashes in its file names, so it can be cached for good
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
